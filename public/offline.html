<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5f86">
  <title>Tanpa sinyal · Berkembang.id</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: #f4f9fc; color: #1b2a3a; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 420px; width: 100%; background: #fff; border: 1px solid #e3e9f0; border-radius: 20px;
      padding: 24px; box-shadow: 0 8px 28px rgba(27, 42, 58, .06); }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 12px; color: #4a6280; }
    button { min-height: 44px; width: 100%; margin-top: 8px; border: 0; border-radius: 12px;
      background: #0b5f86; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Sedang tanpa sinyal</h1>
    <p>Halaman ini belum pernah dibuka di ponsel ini, jadi belum ada salinannya.</p>
    <p>Rekaman dan foto yang sudah Anda buat tetap tersimpan di ponsel dan dikirim otomatis begitu sinyal kembali.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
